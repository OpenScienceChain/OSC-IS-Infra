name: Deploy and test Fabric on EKS

on:
  workflow_dispatch:
    inputs:
      chaincode_ref:
        description: Full 40-character OSC-Chaincode commit SHA
        required: true
        default: ''
        type: string
      retain_network:
        description: Keep Fabric workloads after testing
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: osc-fabric-test-deployment
  cancel-in-progress: false

jobs:
  deploy-test:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: fabric-test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: OSC-IS-Infra
      - name: Require an immutable chaincode revision
        shell: bash
        run: |
          [[ "${{ inputs.chaincode_ref }}" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "chaincode_ref must be a full 40-character commit SHA" >&2
            exit 1
          }
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: OpenScienceChain/OSC-Chaincode
          ref: ${{ inputs.chaincode_ref }}
          path: OSC-Chaincode
      - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415 # v4
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Install script dependencies
        run: sudo apt-get update && sudo apt-get install --yes gettext-base jq
      - uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_FABRIC_TEST_ROLE_ARN }}
          aws-region: us-west-2
          role-duration-seconds: 900
      - name: Connect to the test cluster
        run: aws eks update-kubeconfig --name osc-fabric-test --region us-west-2
      - name: Deploy Fabric 2.5 and OSC chaincode
        env:
          OSC_CHAINCODE_DIR: ${{ github.workspace }}/OSC-Chaincode/chaincode-go
          FABRIC_TEST_EVIDENCE_DIR: ${{ github.workspace }}/evidence
        working-directory: OSC-IS-Infra
        run: ./fabric-test/deploy.sh
      - name: Capture diagnostics
        if: always()
        run: |
          mkdir -p evidence
          kubectl get events -A --sort-by=.lastTimestamp > evidence/events.txt 2>&1 || true
          kubectl get pods -A -o wide > evidence/final-pods.txt 2>&1 || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: fabric-test-evidence-${{ github.run_id }}
          path: evidence
          retention-days: 30
      - name: Remove Fabric workloads
        if: always() && !inputs.retain_network
        working-directory: OSC-IS-Infra
        run: ./fabric-test/destroy-network.sh

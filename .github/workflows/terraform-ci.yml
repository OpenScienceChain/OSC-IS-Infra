name: Terraform CI

on:
  push:
    branches: [main, master, develop, "feature/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clean-checkout-contract:
    name: Clean checkout contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash platform/scripts/validate-clean-checkout.sh

  python-locks:
    name: Python lock policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 scripts/security/check_python_locks.py

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Scan dependency manifests with pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --volume "$PWD:/repo" \
            ghcr.io/aquasecurity/trivy:0.74.0@sha256:ee940acbf1f58ebadb42d01434ce4609530bf1b52536afbd1eee66cd7123c5c9 \
            fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress --offline-scan \
            --skip-dirs /repo/platform/.generated \
            --skip-dirs /repo/terraform/.terraform \
            --skip-dirs /repo/terraform/fabric-test/.terraform \
            --skip-dirs /repo/terraform/usrse26-control/.terraform \
            --skip-dirs /repo/terraform/usrse26-eks/.terraform \
            /repo

  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.2"
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Initialize without remote state
        run: terraform init -backend=false -lockfile=readonly
      - name: Confirm provider lockfile is unchanged
        run: git diff --exit-code -- .terraform.lock.hcl
      - name: Validate configuration
        run: terraform validate

  validate-fabric-test:
    name: Validate ephemeral Fabric EKS profile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: terraform/fabric-test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.2"
      - run: terraform fmt -check
      - run: terraform init -backend=false -lockfile=readonly
      - run: git diff --exit-code -- .terraform.lock.hcl
      - run: terraform validate

  validate-usrse26:
    name: Validate US-RSE demo (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: control
            directory: terraform/usrse26-control
          - profile: eks
            directory: terraform/usrse26-eks
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.16.2"
      - run: terraform fmt -check
      - run: terraform init -backend=false -lockfile=readonly
      - run: git diff --exit-code -- .terraform.lock.hcl
      - run: terraform validate

  test-usrse26-contract:
    name: Test US-RSE demo contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python3 -m unittest discover -s tests/usrse26 -v

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Scan changed history with checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/gitleaks_8.30.1_linux_x64.tar.gz
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory /tmp gitleaks
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="$(git merge-base HEAD origin/develop)..HEAD"
          fi
          /tmp/gitleaks git --redact --no-banner --exit-code 1 --log-opts="$range" .

  terraform-security:
    name: Terraform security policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Scan US-RSE control plane with pinned Checkov
        shell: bash
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            ghcr.io/bridgecrewio/checkov:3.3.9@sha256:12a62da01af22654883aee3b9da18ba4297f123f5122663bf65235db37934144 \
            --directory /repo/terraform/usrse26-control --framework terraform --quiet --compact
      - name: Scan US-RSE runtime with pinned Checkov
        shell: bash
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            ghcr.io/bridgecrewio/checkov:3.3.9@sha256:12a62da01af22654883aee3b9da18ba4297f123f5122663bf65235db37934144 \
            --directory /repo/terraform/usrse26-eks --framework terraform --quiet --compact

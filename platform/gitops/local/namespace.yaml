apiVersion: v1
kind: Namespace
metadata:
  name: osc-apps
  labels:
    app.kubernetes.io/part-of: osc-is
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-gateway
  namespace: osc-apps
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-gateway
  namespace: osc-apps
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: submission-worker
  namespace: osc-apps
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: submission-listener
  namespace: osc-apps
automountServiceAccountToken: false

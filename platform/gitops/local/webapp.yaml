apiVersion: v1
kind: Service
metadata: {name: webapp, namespace: osc-apps}
spec:
  selector: {app.kubernetes.io/name: webapp}
  ports: [{name: http, port: 80, targetPort: 8080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: webapp, namespace: osc-apps}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: webapp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: webapp, app.kubernetes.io/part-of: osc-is}
    spec:
      serviceAccountName: webapp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: webapp
          image: localhost:5017/osc-webapp:usrse26-local
          env:
            - {name: DEMO_MODE, value: "true"}
            - {name: WEBAPP_API_BASE_URL, value: /api/v1}
            - {name: API_UPSTREAM, value: http://api-gateway:3000}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 250m, memory: 128Mi}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webapp
  namespace: osc-apps
spec:
  ingressClassName: nginx
  tls:
    - hosts: [demo.localho.st]
      secretName: demo-local-tls
  rules:
    - host: demo.localho.st
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: webapp, port: {name: http}}

      labels: {app.kubernetes.io/name: submission-listener, app.kubernetes.io/part-of: osc-is}
    spec:
      serviceAccountName: submission-listener
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: submission-listener
          image: localhost:5017/osc-submission-listener:usrse26-local@sha256:a5c5eda42ac9bc15810198208887ea012973d45bddb79ce08286bd2efbaddcb4
          env:

apiVersion: v1
kind: ServiceAccount
metadata:
  name: osc-gitops-repository
  namespace: argocd
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: osc-gitops-repository
  namespace: argocd
  labels:
    app.kubernetes.io/name: osc-gitops-repository
    app.kubernetes.io/part-of: osc-is
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: osc-gitops-repository
  template:
    metadata:
      labels:
        app.kubernetes.io/name: osc-gitops-repository
        app.kubernetes.io/part-of: osc-is
    spec:
      serviceAccountName: osc-gitops-repository
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: repository
          image: __REPOSITORY_IMAGE__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /osc-is-infra.git/HEAD
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /osc-is-infra.git/HEAD
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: osc-gitops-repository
  namespace: argocd
spec:
  selector:
    app.kubernetes.io/name: osc-gitops-repository
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: osc-gitops-repository-ingress
  namespace: argocd
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: osc-gitops-repository
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: argocd-repo-server
      ports:
        - protocol: TCP
          port: 8080

apiVersion: v1
kind: ServiceAccount
metadata: {name: webapp, namespace: osc-apps}
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata: {name: webapp, namespace: osc-apps}
spec:
  selector: {app.kubernetes.io/name: webapp}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: webapp, namespace: osc-apps}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: webapp}
  template:
    metadata:
      labels: {app.kubernetes.io/name: webapp, app.kubernetes.io/part-of: osc-is}
    spec:
      serviceAccountName: webapp
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: webapp
          image: __WEBAPP_IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - {name: API_UPSTREAM, value: "http://api-gateway:3000"}
            - {name: DEMO_MODE, value: "true"}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL], add: [NET_BIND_SERVICE]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: nginx-conf, mountPath: /etc/nginx/conf.d}
            - {name: nginx-cache, mountPath: /var/cache/nginx}
            - {name: nginx-run, mountPath: /var/run}
            - {name: runtime-tmp, mountPath: /tmp}
      volumes:
        - {name: nginx-conf, emptyDir: {}}
        - {name: nginx-cache, emptyDir: {}}
        - {name: nginx-run, emptyDir: {}}
        - {name: runtime-tmp, emptyDir: {}}

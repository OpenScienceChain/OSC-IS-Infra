apiVersion: v1
kind: Namespace
metadata:
  name: osc-apps
  labels:
    app.kubernetes.io/part-of: osc-is
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: api-gateway, namespace: osc-apps}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: postgres, namespace: osc-apps}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: submission-worker, namespace: osc-apps}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: submission-listener, namespace: osc-apps}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: history-worker, namespace: osc-apps}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ledger-gateway-nsg, namespace: osc-apps}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ledger-gateway-citizen-science, namespace: osc-apps}
automountServiceAccountToken: false
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: postgres-secrets, namespace: osc-apps}
spec:
  provider: aws
  parameters:
    region: us-west-2
    usePodIdentity: "true"
    objects: |
      - objectName: "__POSTGRES_SECRET_NAME__"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "username"
          - path: "password"
            objectAlias: "password"
          - path: "database"
            objectAlias: "database"
  secretObjects:
    - secretName: postgres-credentials
      type: Opaque
      data:
        - {objectName: username, key: username}
        - {objectName: password, key: password}
        - {objectName: database, key: database}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: api-gateway-secrets, namespace: osc-apps}
spec:
  provider: aws
  parameters:
    region: us-west-2
    usePodIdentity: "true"
    objects: |
      - objectName: "__API_AUTH_SECRET_NAME__"
        objectType: "secretsmanager"
        jmesPath:
          - {path: "jwtSecret", objectAlias: "jwt-secret"}
          - {path: "bootstrapAdminPassword", objectAlias: "bootstrap-password"}
      - objectName: "__LISTENER_AUTH_SECRET_NAME__"
        objectType: "secretsmanager"
        jmesPath:
          - {path: "listenerApiKey", objectAlias: "listener-api-key"}
      - objectName: "__DEMO_AUTH_SECRET_NAME__"
        objectType: "secretsmanager"
        jmesPath:
          - {path: "demoJwtSecret", objectAlias: "demo-jwt-secret"}
          - {path: "demoAnalyticsHmacSecret", objectAlias: "demo-analytics-hmac-secret"}
          - {path: "demoControlApiKey", objectAlias: "demo-control-api-key"}
      - objectName: "__POSTGRES_SECRET_NAME__"
        objectType: "secretsmanager"
        jmesPath:
          - {path: "username", objectAlias: "postgres-username"}
          - {path: "password", objectAlias: "postgres-password"}
          - {path: "database", objectAlias: "postgres-database"}
      - objectName: "__RABBITMQ_SECRET_NAME__"
        objectType: "secretsmanager"
        jmesPath:
          - {path: "username", objectAlias: "rabbitmq-username"}
          - {path: "password", objectAlias: "rabbitmq-password"}
  secretObjects:
    - secretName: api-auth
      type: Opaque
      data: [{objectName: jwt-secret, key: jwt-secret}]
    - secretName: api-bootstrap-admin
      type: Opaque
      data: [{objectName: bootstrap-password, key: password}]
    - secretName: api-listener-auth
      type: Opaque
      data: [{objectName: listener-api-key, key: api-key}]
    - secretName: api-demo-auth
      type: Opaque
      data:
        - {objectName: demo-jwt-secret, key: jwt-secret}
        - {objectName: demo-analytics-hmac-secret, key: analytics-hmac-secret}
        - {objectName: demo-control-api-key, key: control-api-key}
    - secretName: api-postgres-credentials
      type: Opaque
      data:
        - {objectName: postgres-username, key: username}
        - {objectName: postgres-password, key: password}
        - {objectName: postgres-database, key: database}
    - secretName: api-rabbitmq-credentials
      type: Opaque
      data:
        - {objectName: rabbitmq-username, key: username}
        - {objectName: rabbitmq-password, key: password}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: submission-worker-secrets, namespace: osc-apps}
spec:
  provider: aws
  parameters:
    region: us-west-2
    usePodIdentity: "true"
    objects: |
      - objectName: "__LEDGER_NSG_AUTH_SECRET_NAME__"
        objectType: "secretsmanager"
        jmesPath:
          - {path: "nsgLedgerToken", objectAlias: "nsg-ledger-token"}
      - objectName: "__LEDGER_CITIZEN_AUTH_SECRET_NAME__"
        objectType: "secretsmanager"
        jmesPath:
          - {path: "citizenScienceLedgerToken", objectAlias: "citizen-ledger-token"}
      - objectName: "__RABBITMQ_SECRET_NAME__"
        objectType: "secretsmanager"
        jmesPath:
          - {path: "username", objectAlias: "worker-rabbitmq-username"}
          - {path: "password", objectAlias: "worker-rabbitmq-password"}
  secretObjects:
    - secretName: worker-ledger-auth
      type: Opaque
      data:
        - {objectName: nsg-ledger-token, key: nsg-token}
        - {objectName: citizen-ledger-token, key: citizen-science-token}
    - secretName: worker-rabbitmq-credentials
      type: Opaque
      data:
        - {objectName: worker-rabbitmq-username, key: username}
        - {objectName: worker-rabbitmq-password, key: password}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: submission-listener-secrets, namespace: osc-apps}
spec:
  provider: aws
  parameters:
    region: us-west-2
    usePodIdentity: "true"
    objects: |
      - objectName: "__LISTENER_AUTH_SECRET_NAME__"
        objectType: "secretsmanager"
        jmesPath:
          - {path: "listenerApiKey", objectAlias: "listener-api-key"}
      - objectName: "__RABBITMQ_SECRET_NAME__"
        objectType: "secretsmanager"
        jmesPath:
          - {path: "username", objectAlias: "listener-rabbitmq-username"}
          - {path: "password", objectAlias: "listener-rabbitmq-password"}
  secretObjects:
    - secretName: listener-api-auth
      type: Opaque
      data: [{objectName: listener-api-key, key: api-key}]
    - secretName: listener-rabbitmq-credentials
      type: Opaque
      data:
        - {objectName: listener-rabbitmq-username, key: username}
        - {objectName: listener-rabbitmq-password, key: password}
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: ledger-gateway-nsg-secrets, namespace: osc-apps}
spec:
  provider: aws
  parameters:
    region: us-west-2
    usePodIdentity: "true"
    objects: |
      - objectName: "__LEDGER_NSG_AUTH_SECRET_NAME__"
        objectType: "secretsmanager"
        jmesPath:
          - {path: "nsgLedgerToken", objectAlias: "ledger-token"}
      - objectName: "__FABRIC_NSG_SECRET_NAME__"
        objectType: "secretsmanager"
        jmesPath:
          - {path: "certificate", objectAlias: "certificate.pem"}
          - {path: "privateKey", objectAlias: "private-key.pem"}
          - {path: "tlsCa", objectAlias: "tls-ca.pem"}
  secretObjects:
    - secretName: ledger-gateway-nsg-auth
      type: Opaque
      data: [{objectName: ledger-token, key: token}]
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: ledger-gateway-citizen-science-secrets, namespace: osc-apps}
spec:
  provider: aws
  parameters:
    region: us-west-2
    usePodIdentity: "true"
    objects: |
      - objectName: "__LEDGER_CITIZEN_AUTH_SECRET_NAME__"
        objectType: "secretsmanager"
        jmesPath:
          - {path: "citizenScienceLedgerToken", objectAlias: "ledger-token"}
      - objectName: "__FABRIC_CITIZEN_SECRET_NAME__"
        objectType: "secretsmanager"
        jmesPath:
          - {path: "certificate", objectAlias: "certificate.pem"}
          - {path: "privateKey", objectAlias: "private-key.pem"}
          - {path: "tlsCa", objectAlias: "tls-ca.pem"}
  secretObjects:
    - secretName: ledger-gateway-citizen-science-auth
      type: Opaque
      data: [{objectName: ledger-token, key: token}]

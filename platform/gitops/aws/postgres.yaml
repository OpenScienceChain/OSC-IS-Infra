apiVersion: v1
kind: Service
metadata: {name: postgres, namespace: osc-apps}
spec:
  selector: {app.kubernetes.io/name: postgres}
  ports: [{name: postgres-tls, port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres, namespace: osc-apps}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgres, app.kubernetes.io/part-of: osc-is}
    spec:
      serviceAccountName: postgres
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: prepare-tls
          image: busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: [sh, -ec]
          args: ['cp /source/tls.crt /tls/tls.crt; cp /source/tls.key /tls/tls.key; cp /source/ca.crt /tls/ca.crt; chmod 600 /tls/tls.key']
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: issued-tls, mountPath: /source, readOnly: true}
            - {name: runtime-tls, mountPath: /tls}
            - {name: aws-secrets, mountPath: /var/run/osc/aws-secrets, readOnly: true}
      containers:
        - name: postgres
          image: postgres:17.11@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgresql/tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgresql/tls/tls.key
            - -c
            - ssl_ca_file=/etc/postgresql/tls/ca.crt
          env:
            - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
            - name: POSTGRES_USER
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: username}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: password}}
            - name: POSTGRES_DB
              valueFrom: {secretKeyRef: {name: postgres-credentials, key: database}}
          ports: [{name: postgres-tls, containerPort: 5432}]
          readinessProbe:
            exec: {command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec: {command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']}
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: runtime-tls, mountPath: /etc/postgresql/tls, readOnly: true}
            - {name: aws-secrets, mountPath: /var/run/osc/aws-secrets, readOnly: true}
      volumes:
        - name: issued-tls
          secret: {secretName: postgres-tls}
        - {name: runtime-tls, emptyDir: {}}
        - name: aws-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: {secretProviderClass: postgres-secrets}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        storageClassName: gp3-osc
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 2Gi}}

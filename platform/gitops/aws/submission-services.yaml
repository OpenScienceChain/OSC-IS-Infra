            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: aws-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: {secretProviderClass: submission-listener-secrets}
        - {name: tmp, emptyDir: {}}

apiVersion: v1
kind: Service
metadata: {name: ledger-gateway-magnetic-arch, namespace: osc-apps}
spec:
  selector: {app.kubernetes.io/name: ledger-gateway-magnetic-arch}
  ports: [{name: http, port: 4000, targetPort: 4000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: ledger-gateway-magnetic-arch, namespace: osc-apps}
spec:
  replicas: 0
  selector:
    matchLabels: {app.kubernetes.io/name: ledger-gateway-magnetic-arch}
  template:
    metadata:
      labels: {app.kubernetes.io/name: ledger-gateway-magnetic-arch, app.kubernetes.io/part-of: osc-is}
    spec:
      serviceAccountName: ledger-gateway-magnetic-arch
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ledger-gateway
          image: __LEDGER_GATEWAY_IMAGE__
          env:
            - {name: FABRIC_REAL_MODE, value: "true"}
            - {name: FABRIC_CHANNEL, value: osc-channel}
            - {name: FABRIC_CHAINCODE, value: osc-provenance}
            - {name: ORGANIZATION_ID, value: dddddddd-dddd-4ddd-8ddd-dddddddddddd}
            - {name: MAGNETIC_ARCH_ORGANIZATION_ID, value: dddddddd-dddd-4ddd-8ddd-dddddddddddd}
            - {name: MSP_ID, value: MagneticArchMSP}
            - {name: PEER_ENDPOINT, value: org3-peer-gateway-svc.osc-fabric.svc.cluster.local:7051}
            - {name: TLS_SERVER_NAME, value: org3-peer-gateway-svc}
            - {name: TLS_CERT_PATH, value: /var/run/osc/fabric/tls-ca.pem}
            - {name: CERTIFICATE_PATH, value: /var/run/osc/fabric/certificate.pem}
            - {name: PRIVATE_KEY_PATH, value: /var/run/osc/fabric/private-key.pem}
            - name: LEDGER_GATEWAY_TOKEN
              valueFrom: {secretKeyRef: {name: ledger-gateway-magnetic-arch-auth, key: token}}
          ports: [{name: http, containerPort: 4000}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - {name: identity, mountPath: /var/run/osc/fabric, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: identity
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes: {secretProviderClass: ledger-gateway-magnetic-arch-secrets}
        - {name: tmp, emptyDir: {}}
---
apiVersion: v1
kind: Service
metadata: {name: history-worker-magnetic-arch, namespace: osc-apps}
spec:
  selector: {app.kubernetes.io/name: history-worker-magnetic-arch}
  ports: [{name: http, port: 8002, targetPort: 8002}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: history-worker-magnetic-arch, namespace: osc-apps}
spec:
  replicas: 0
  selector:
    matchLabels: {app.kubernetes.io/name: history-worker-magnetic-arch}
  template:
    metadata:
      labels: {app.kubernetes.io/name: history-worker-magnetic-arch, app.kubernetes.io/part-of: osc-is}
    spec:
      serviceAccountName: history-worker
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: history-worker
          image: __HISTORY_WORKER_IMAGE__
          env:
            - {name: BRIDGE_URL, value: http://ledger-gateway-magnetic-arch:4000}
            - name: LEDGER_GATEWAY_TOKEN
              valueFrom: {secretKeyRef: {name: ledger-gateway-magnetic-arch-auth, key: token}}
            - {name: CACHE_TTL_SECONDS, value: "60"}
            - {name: CACHE_MAX_ARTIFACTS, value: "1000"}
          ports: [{name: http, containerPort: 8002}]
          readinessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: http}, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          resources:
            requests: {cpu: 50m, memory: 96Mi}
            limits: {cpu: 500m, memory: 384Mi}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {}}]

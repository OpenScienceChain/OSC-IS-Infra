kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: 127.0.0.1
  apiServerPort: 16443
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true,osc.open-science-chain.org/tier=control"
    extraPortMappings:
      - containerPort: 80
        hostPort: 18080
        listenAddress: 127.0.0.1
        protocol: TCP
      - containerPort: 443
        hostPort: 18443
        listenAddress: 127.0.0.1
        protocol: TCP
  - role: worker
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    labels:
      osc.open-science-chain.org/tier: ledger
      osc.open-science-chain.org/worker: "1"
  - role: worker
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    labels:
      osc.open-science-chain.org/tier: application
      osc.open-science-chain.org/worker: "2"
  - role: worker
    image: kindest/node:v1.34.11@sha256:44e222ee2132dab25ff87301682f89eb82c7880ea3a1bf543bfe9708fd08d67d
    labels:
      osc.open-science-chain.org/tier: mixed
      osc.open-science-chain.org/worker: "3"
